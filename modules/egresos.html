<h1>Egresos</h1>

<div class="contenedorEgresos">

    <div class="cardNuevoEgreso">

        <h2>Registrar Egreso</h2>

        <div class="campoEgreso">

            <label>Concepto</label>

            <input
                type="text"
                id="conceptoEgreso"
                placeholder="Ej: Compra de hielo">

        </div>

        <div class="campoEgreso">

            <label>Importe</label>

            <input
                type="number"
                id="importeEgreso"
                placeholder="Ingrese el importe"
                min="0">

        </div>

        <button
            id="btnRegistrarEgreso">

            💸 Registrar Egreso

        </button>

    </div>


    <div class="listaEgresos">

        <h2>Egresos de la jornada</h2>

        <div id="listaEgresos">

        </div>

    </div>

</div>
